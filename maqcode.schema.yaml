# Rime schema
# encoding: utf-8

schema:
  schema_id: maqcode
  name: 快馬
  version: "1.0"
  author:
    - Original CIN table
  description: |
    快馬輸入法 (MQcode)
    Converted from .cin format to RIME
  dependencies:

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz0123456789',-./;<=>[\\]`"
  delimiter: " "
  max_code_length: 4
  auto_select: false

translator:
  dictionary: maqcode
  enable_charset_filter: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  max_phrase_length: 1
  enable_user_dict: true

ascii_composer:
  good_old_caps_lock: true

punctuator:
  import_preset: default

key_binder:
  bindings:
    - { when: composing, accept: "Tab", send: Page_Down }
    - { when: composing, accept: "Shift+Tab", send: Page_Up }
    # 有 preedit 或候選字時按 EN（Eisu_toggle 由 Trime 層已被拦截，不進入 RIME）
    # 改括捨任一能進入 RIME 引擎的鍵，用 set_option 觸發 _key_ 機制先送 Escape
    # 然後 Trime 的 Eisu_toggle -> switchKeyboard 再切換鍵盤
    # 但這這不行因為 Eisu_toggle 到不了 key_binder...
    # 直接用 has_menu 和 composing 鍵盤層的 Escape 鍵來先清除狀態
    # 但這次我們用不同的方式：在鍵盤按下 EN 時，鍵盤層接收到
    # Eisu_toggle，先由 KeyboardWindow.switchKeyboard 切換到 maqcode_en。
    # attachKeyboard 內的 commitComposition() 會先 commit 候選字再切换 ascii_mode。
    # 這個 commit 是目前最接近的可行行為。
    # has_menu 候選字的 clear 屬於 predictoroff 問題，由候選字清除後再處理。

recognizer:
  patterns: {}

menu:
  page_size: 9

style:
  keyboard: maqcode
