patch:
  # ==============================
  # 自訂按鍵（直接上屏的中文標點）
  # ==============================
  "preset_keys/cn_comma":  {label: '，', commit: '，'}
  "preset_keys/cn_period": {label: '。', commit: '。'}
  "preset_keys/cn_lparen": {label: '（', commit: '（'}
  "preset_keys/cn_rparen": {label: '）', commit: '）'}
  "preset_keys/cn_colon":  {label: '：', commit: '：'}
  "preset_keys/cn_semi":   {label: '；', commit: '；'}
  "preset_keys/cn_dash":   {label: '——', commit: '——'}

  # ==============================
  # 快馬主鍵盤
  # ==============================
  "preset_keyboards/maqcode":
    name: 快馬
    author: maqcode custom
    ascii_mode: 0
    height: 46
    width: 9
    lock: true
    keys:
      # 行1：` + 數字（11鍵，` 佔10%，數字各9%）
      - {click: '`'}
      - {click: '1'}
      - {click: '2'}
      - {click: '3'}
      - {click: '4'}
      - {click: '5'}
      - {click: '6'}
      - {click: '7'}
      - {click: '8'}
      - {click: '9'}
      - {click: '0', width: 10}

      # 行2：QWERTYUIOP + -（長按=）（11鍵）
      - {click: q}
      - {click: w}
      - {click: e}
      - {click: r}
      - {click: t}
      - {click: y}
      - {click: u}
      - {click: i}
      - {click: o}
      - {click: p}
      - {click: '-', long_click: '=', hint: '=', width: 10}

      # 行3：ASDFGHJKL + ; + '（11鍵）
      - {click: a}
      - {click: s}
      - {click: d}
      - {click: f}
      - {click: g}
      - {click: h}
      - {click: j}
      - {click: k}
      - {click: l}
      - {click: ';'}
      - {click: "'", width: 10}

      # 行4：ZXCVBNM + / + \ + [ + ]（11鍵）
      - {click: z}
      - {click: x}
      - {click: c}
      - {click: v}
      - {click: b}
      - {click: n}
      - {click: m}
      - {click: '/', long_click: cn_comma, hint: '，'}
      - {click: '\', long_click: cn_period, hint: '。'}
      - {click: '['}
      - {click: ']', width: 10}

      # 行5：功能列
      - {click: Escape, label: 'ESC', width: 12}
      - {click: liquid_keyboard_emoji, label: '😊', width: 13}
      - {click: Keyboard_maqcodepunct, label: '符', width: 13}
      - {click: space, label: ' ', width: 30}
      - {click: Return, label: '↵', width: 12}
      - {click: BackSpace, label: '⌫', width: 10}
      - {click: Mode_switch, label: 'EN', width: 10}

  # ==============================
  # 快馬符號鍵盤（點符號後自動回主鍵盤）
  # ==============================
  "preset_keyboards/maqcodepunct":
    name: 快馬符號
    author: maqcode custom
    ascii_mode: 0
    height: 46
    width: 20
    lock: false
    keys:
      # 行1：常用標點
      - {click: '，', label: '，', width: 20}
      - {click: '。', label: '。', width: 20}
      - {click: '！', label: '！', width: 20}
      - {click: '？', label: '？', width: 20}
      - {click: '、', label: '、', width: 20}
      # 行2：括號類
      - {click: '「', label: '「', width: 20}
      - {click: '」', label: '」', width: 20}
      - {click: '『', label: '『', width: 20}
      - {click: '』', label: '』', width: 20}
      - {click: '…', label: '…', width: 20}
      # 行3：其他常用
      - {click: '《', label: '《', width: 20}
      - {click: '》', label: '》', width: 20}
      - {click: '〈', label: '〈', width: 20}
      - {click: '〉', label: '〉', width: 20}
      - {click: '・', label: '・', width: 20}
      # 行4：括號、冒號、分號、破折號
      - {click: cn_lparen, width: 20}
      - {click: cn_rparen, width: 20}
      - {click: cn_colon,  width: 20}
      - {click: cn_semi,   width: 20}
      - {click: cn_dash,   width: 20}
      # 行5：功能列
      - {click: Keyboard_maqcode, label: '返回', width: 40}
      - {click: space, label: ' ', width: 30}
      - {click: BackSpace, label: '⌫', width: 30}
